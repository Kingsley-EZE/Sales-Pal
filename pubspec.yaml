name: sales_pal
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
  flutter_gen: ^5.15.0
  go_router: ^18.0.0
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  injectable: ^3.0.0
  dartz: ^0.10.1
  internet_connection_checker_plus: ^3.1.1
  equatable: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.12.0
  flutter_gen_runner: ^5.15.0
  go_router_builder: ^4.3.1
  injectable_generator: ^3.1.0

flutter:

  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/data/

flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true

